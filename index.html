<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ina以娜 | 預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f6f1ed; color: #5e503f; font-family: sans-serif; }
        .card { background: white; border-radius: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .step-active { border-bottom: 2px solid #5e503f; font-weight: bold; }
        .time-slot { border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; cursor: pointer; text-align: center; font-size: 14px; }
        .time-slot.selected { background-color: #5e503f; color: white; border-color: #5e503f; }
        .btn-main { background-color: #d6c6b8; color: white; border-radius: 999px; }
        .disabled { opacity: 0.15; cursor: not-allowed; text-decoration: line-through; }
        .holiday-circle { background-color: #f9f4f0; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .day-cell { padding: 4px; }
    </style>
</head>
<body class="p-4">
    <main class="max-w-xl mx-auto card p-8 relative">
        <nav class="flex justify-between mb-8 text-[10px] text-stone-400 uppercase">
            <span id="nav-1" class="step-active pb-1">01. 日期</span>
            <span id="nav-2" class="pb-1">02. 時段</span>
            <span id="nav-3" class="pb-1">03. 資料</span>
        </nav>

        <section id="view-date">
            <div class="flex justify-between items-center mb-8 font-bold text-lg">
                <button onclick="changeMonth(-1)" class="opacity-50">＜</button>
                <div id="month-title">2026 / 07</div>
                <button onclick="changeMonth(1)" class="opacity-50">＞</button>
            </div>
            <div class="grid grid-cols-7 gap-2 text-center text-[10px] text-stone-400 mb-4 uppercase">
                <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center text-sm"></div>
        </section>

        <section id="view-time" class="hidden">
            <div class="flex justify-between items-baseline mb-1">
                <h2 class="text-lg font-medium">選擇時段</h2>
                <span id="service-hint-text" class="text-rose-500 text-[11px] font-medium hidden">★ 設計款服務僅接受 14:30 以前時段</span>
            </div>
            <p id="time-hint" class="text-xs opacity-50 mb-6"></p>
            <div id="time-grid" class="grid grid-cols-3 gap-3 mb-8"></div>
            <div class="flex justify-between items-center">
                <button onclick="goTo('date')" class="text-xs underline opacity-50">← 返回</button>
                <button id="next-btn" onclick="goTo('info')" class="btn-main px-12 py-3 text-xs disabled:opacity-30" disabled>下一步</button>
            </div>
        </section>

        <section id="view-info" class="hidden">
            <div class="bg-stone-50 p-4 rounded-2xl mb-6 text-sm border border-stone-100">
                <p class="text-[9px] opacity-40 uppercase">已選時間</p>
                <p id="final-dt" class="font-bold"></p>
            </div>
            <div class="space-y-6 mb-6">
                <input type="text" id="cust-name" placeholder="請輸入姓名" class="w-full border-b border-stone-200 bg-transparent py-2 text-sm focus:outline-none">
                <input type="text" id="cust-bday" placeholder="生日 (例：1995/08/13)" class="w-full border-b border-stone-200 bg-transparent py-2 text-sm focus:outline-none">
            </div>
            <select id="cust-service" class="w-full border-b border-stone-200 bg-transparent py-2 mb-6 text-sm focus:outline-none cursor-pointer">
                <option>經典單根</option>
                <option>柔密款</option>
                <option>設計款</option>
            </select>
            <div class="space-y-3 mb-8 text-sm">
                <label class="flex items-center p-3 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-50"><input type="checkbox" value="下睫毛" class="cust-extra mr-3"> 下睫毛</label>
                <label class="flex justify-between p-3 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-50"><div class="flex items-center"><input type="checkbox" value="本店卸除" class="cust-extra mr-3"> 本店卸除</div><span>$200</span></label>
                <label class="flex justify-between p-3 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-50"><div class="flex items-center"><input type="checkbox" value="本店卸除重接" class="cust-extra mr-3"> 本店卸除重接</div><span class="text-stone-400">Free</span></label>
                <label class="flex justify-between p-3 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-50"><div class="flex items-center"><input type="checkbox" value="他店卸除" class="cust-extra mr-3"> 他店卸除</div><span>$400</span></label>
                <label class="flex justify-between p-3 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-50"><div class="flex items-center"><input type="checkbox" value="他店卸除重接" class="cust-extra mr-3"> 他店卸除重接</div><span>$300</span></label>
            </div>
            
            <p class="text-[11px] text-rose-500 bg-rose-50 p-3 rounded-xl mb-4 text-center leading-relaxed font-bold">
                點擊後將自動複製預約訊息，<br>跳轉至官方Line後，記得「貼上並送出」，<br>收到我的回覆才算預約成功喔！
            </p>

            <button onclick="submitReservation()" class="w-full btn-main py-4 font-bold text-sm hover:opacity-90 transition-opacity">確認預約並跳轉 Line</button>
        </section>
    </main>

    <div id="custom-alert" class="fixed inset-0 flex items-center justify-center bg-black/40 z-50 hidden p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-xl border border-stone-100">
            <h3 class="text-stone-800 font-bold text-base mb-4">預約提示</h3>
            <p id="alert-message" class="text-stone-600 text-sm leading-relaxed mb-6"></p>
            <button id="alert-confirm" class="w-full btn-main py-3 font-semibold text-xs tracking-wider">確定</button>
        </div>
    </div>

    <script>
        const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
        let state = { y: 2026, m: 6, d: null, t: null };
        const OFF = ["2026-07-01", "2026-07-03", "2026-07-04", "2026-07-05", "2026-07-06", "2026-07-07", "2026-07-09", "2026-07-10", "2026-07-11", "2026-07-13", "2026-07-15", "2026-07-18", "2026-07-19", "2026-07-20", "2026-07-21", "2026-07-22", "2026-07-23", "2026-07-24", "2026-07-25", "2026-07-26", "2026-07-27", "2026-07-28", "2026-07-30", "2026-08-01", "2026-08-02", "2026-08-03", "2026-08-04", "2026-08-07", "2026-08-08", "2026-08-09"];
        const LIMITS = { 
            "2026-07-02": ["13:30", "14:00", "14:30", "15:00"], 
            "2026-07-11": ["16:30", "17:00"],
            "2026-07-31": ["10:00"]
        };

        function changeMonth(delta) { state.m += delta; if(state.m > 7) state.m = 7; if(state.m < 6) state.m = 6; renderCalendar(); }
        function showMsg(text, cb) { const modal = document.getElementById('custom-alert'); document.getElementById('alert-message').innerText = text; modal.classList.remove('hidden'); document.getElementById('alert-confirm').onclick = () => { modal.classList.add('hidden'); if(cb) cb(); }; }
        function renderCalendar() {
            document.getElementById('month-title').innerText = `${state.y} / ${(state.m+1).toString().padStart(2,'0')}`;
            const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
            const firstDay = new Date(state.y, state.m, 1).getDay(), lastDate = new Date(state.y, state.m + 1, 0).getDate();
            for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
            for(let i=1; i<=lastDate; i++) {
                const dateObj = new Date(state.y, state.m, i); dateObj.setHours(0, 0, 0, 0);
                const s = `${state.y}-${(state.m+1).toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
                const isH = [0,6].includes(dateObj.getDay());
                const el = document.createElement('div'); el.innerText = i; el.className = `cursor-pointer ${isH ? 'holiday-circle' : 'p-2'}`;
                if (dateObj <= TODAY || OFF.includes(s)) el.classList.add('disabled');
                else el.onclick = () => { state.d = s; renderTime(isH); goTo('time'); };
                const w = document.createElement('div'); w.className = 'day-cell'; w.appendChild(el); grid.appendChild(w);
            }
        }
        function renderTime(isH) {
            const grid = document.getElementById('time-grid'); grid.innerHTML = '';
            document.getElementById('time-hint').innerText = state.d;
            document.getElementById('service-hint-text').classList.toggle('hidden', isH);
            let slots = isH ? ["14:00","14:30","15:00","15:30","16:00","16:30","17:00"] : ["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00"];
            if (LIMITS[state.d]) slots = LIMITS[state.d];
            slots.forEach(t => { const el = document.createElement('div'); el.innerText = t; el.className = 'time-slot'; el.onclick = () => { document.querySelectorAll('.time-slot').forEach(e=>e.classList.remove('selected')); el.classList.add('selected'); state.t = t; const btn = document.getElementById('next-btn'); btn.disabled = false; btn.className = 'btn-main px-12 py-3 text-xs'; }; grid.appendChild(el); });
        }
        function goTo(v) { ['date','time','info'].forEach((s, i) => { document.getElementById('view-'+s).classList.toggle('hidden', s!==v); document.getElementById('nav-'+(i+1)).className = (s===v ? 'step-active' : '') + ' pb-1'; }); if(v==='info') document.getElementById('final-dt').innerText = state.d + ' ' + state.t; }
        function submitReservation() { const name = document.getElementById('cust-name').value.trim(); const bday = document.getElementById('cust-bday').value.trim(); if(!name || !bday) { showMsg("請填寫姓名與生日唷！"); return; } const extras = Array.from(document.querySelectorAll('.cust-extra:checked')).map(cb => cb.value).join(', '); const msg = `預約日期：${state.d}\n預約時段：${state.t}\n姓名：${name}\n生日：${bday}\n服務：${document.getElementById('cust-service').value}\n加購/卸除：${extras || '無'}`; const t = document.createElement("textarea"); t.value = msg; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); showMsg("已複製訊息，貼上至官方Line即可送出！", () => window.location.href = "https://lin.ee/8nG0CEA"); }
        window.onload = renderCalendar;
    </script>
</body>
</html>
